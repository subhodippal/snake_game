<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game | Web Based Game</title>
    <link rel="icon" type="image/jpeg" href="../game_assests/images/favicon.png" />
    <link rel="stylesheet" href="./styles.css" />
    <meta name="theme-color" content="#87c029" />
</head>

<body>
    <div class="body">
        <div class="scoreBoard">
            <p id="currentScoreBoard">Score: 0</p>
            <hr />
            <p id="highscoreBoard">HighScore: 0</p>
        </div>

        <div class="scoreBoardSmall">
            <p id="currentScoreBoard">Score: 0</p>
            <p id="highscoreBoard">HighScore: 0</p>
        </div>

        <div class="links" id="links">
            <!-- <div id="profile_face">🐍<span clss="snakeversion">Snake Lite</span></div> -->
            <!-- <hr /> -->
            Also try 👉 
            <span class="stable" data-normal>Normal</span> |
            <span class="beta" data-advance>Advance</span>
        </div>
        <div id="board"></div>


        <div id="gamepad">
            <!-- Add onclik here and use event deligation | add event listner -->
            <div class="row">
                <div class="key key-up" onclick="keyInputHandler('ArrowUp')">
                    <span>Up</span>
                </div>
                <div class="key key-right" onclick="keyInputHandler('ArrowRight')">
                    <span>Right</span>
                </div>
            </div>
            <div class="row">
                <div class="key key-left" onclick="keyInputHandler('ArrowLeft')">
                    <span>Left</span>
                </div>
                <div class="key key-down" onclick="keyInputHandler('ArrowDown')">
                    <span>Down</span>
                </div>
            </div>
        </div>
    </div>

</body>
<script src="./index.js"></script>

</html>
